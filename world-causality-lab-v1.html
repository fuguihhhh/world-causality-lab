    <div class="control-row"><label>Region<select id="regionSelect">${Object.keys(state.regions).map(r=>`<option value="${r}" ${r===selectedRegionId?'selected':''}>${state.regions[r].name}</option>`).join('')}</select></label><label>Resource<select id="resourceSelect">${World.RESOURCE_TYPES.map(r=>`<option value="${r}" ${r===selectedResource?'selected':''}>${titleCase(r)}</option>`).join('')}</select></label></div>
    <div class="section-title">Geological parcels</div>
    <div class="parcel-grid">${parcels.map(p=>`<button class="parcel ${p.id===selectedParcelId?'active':''}" data-parcel="${p.id}">${p.index}<small>${p.id.replace(selectedRegionId+'_','')}</small></button>`).join('')}</div>
    <div class="section-title">Exploration methods</div>
    ${methods.map(m=>`<button class="action-btn" data-explore="${m.id}" ${m.available?'':'disabled'}><span><b>${m.label}</b><small>${m.description}</small></span><em>${m.cost} · ${m.years} yr</em>${m.available?'':`<i>${m.reason}</i>`}</button>`).join('')}
    ${status?`<div class="status-box"><b>Knowledge</b><span>Confidence ${(status.confidence*100).toFixed(0)}%</span><span>Methods ${status.methodsUsed.length}</span><span>${deposit?'Deposit discovered':'No confirmed deposit'}</span><span>${deposit?.developed?'Developed':mineProject?`Mine building · ${mineProject.turnsRemaining}y`:deposit?'Ready for mine development':''}</span></div>`:''}
    ${deposit&&!deposit.developed&&!mineProject?`<button class="action-btn" data-develop-deposit="${deposit.id}"><span><b>Develop ${titleCase(deposit.resourceType)} deposit</b><small>Create a real extraction facility from this assessed deposit.</small></span><em>Start mine</em></button>`:''}
    <div class="section-title">Physical development</div>
    <div class="dev-actions"><button data-build="basic_factory">Build Factory</button><button data-build="steelworks">Build Steelworks</button><button data-build="power_plant">Build Power Plant</button><button data-build="port" ${selectedRegionId==='eastern_coast'?'':'disabled'}>Build Port</button><button data-build="railway">Build Railway</button></div>
    <div class="info-note">Model 2 now uses the saved visual asset library directly on the map. Construction appears immediately; completion and upgrades switch to the matching saved asset level.</div>
    <div class="section-title">Facilities in selected region</div>
    <div class="facility-list">${localFacilities.length?localFacilities.map(f=>facilityCard(f,state)).join(''):'<small>No completed facilities here yet.</small>'}</div>
    <div class="section-title">Transport links</div>
    <div class="facility-list">${localConnections.length?localConnections.map(c=>connectionCard(c,state)).join(''):'<small>No completed railway link here yet.</small>'}</div>`;
}
function renderDebugPanel(){
  $('panelTitle').textContent='Integration Debug';
  const state=session.state;
  const recent=(state.history||[]).slice(-12).reverse();
  $('panelBody').innerHTML=`
    <div class="check-card"><b>Build self-check</b><span class="pass">Urban lifecycle + Model 2 visual layer</span><small><span class="visual-count">${Object.keys(MODEL2_ASSETS).length}</span> saved Model 2 assets embedded in this HTML · facility/project/railway visual switching enabled</small></div>
    <div class="section-title">Template override</div>
    <div class="dev-actions"><button data-force-map="">Random</button>${Main.MAP_TEMPLATES.map(t=>`<button data-force-map="${t.id}">${t.id}</button>`).join('')}</div>
    <div class="section-title">Urban signal test adapter</div>
    <div class="dev-actions"><button data-signal="stress">Stress Westhaven</button><button data-signal="recover">Recovery</button><button data-signal="clear">Clear Signals</button></div>
    <label class="toggle"><input type="checkbox" id="showCandidates" ${$('showCandidates')?.checked?'checked':''}> Show potential settlement sites</label>
    <div class="section-title">Recent causal/world history</div>
    <div class="history">${recent.length?recent.map(e=>`<div><b>${e.year??state.time.year}</b><span>${e.type}</span><small>${e.cityId||e.regionId||e.projectId||''}</small></div>`).join(''):'<small>No history yet.</small>'}</div>`;
}

function renderPanel(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
  if(activeTab==='world')renderWorldPanel();
  else if(activeTab==='cities')renderCitiesPanel();
  else if(activeTab==='development')renderDevelopmentPanel();
  else renderDebugPanel();
}
function render(){renderMap();renderPanel();}

async function advanceYear(){
  const btn=$('advanceBtn'); if(btn.disabled)return; btn.disabled=true;
  try{
    const out=window.BorderEpoch?.Module8
      ? await window.BorderEpoch.Module8.advanceOneYear(session,{World,Development,Main})
      : Main.advanceOneYear(session,World,Development);
    lastEvents=out.urbanEvents||[];
    if(lastEvents.length)toast(lastEvents.map(e=>`${e.type.replace('CITY_','')} ${session.state.cities[e.cityId]?.name||e.cityId}`).join(' · '),'good');
    else toast(`Advanced to ${out.year}`);
    window.__BE_LAST_INTEGRATION_REPORT__=out;
    render();
  }catch(err){console.error('Border Epoch annual integration failed',err);toast(`Advance failed: ${err.message||err}`,'bad');}
  finally{btn.disabled=false;}
}

function startExplore(method){
  const r=Development.startExploration(selectedRegionId,selectedResource,method,session.state,{parcelId:selectedParcelId});
  if(!r.ok){toast(r.error||'Unable to start exploration','bad');return;}
  toast(`${r.project.name} started`,'good');render();
}
function build(type){
  const s=session.state;
  if(type==='railway'){
    const other=selectedRegionId==='eastern_coast'?'central_corridor':'eastern_coast';
    const r=Development.startProject({type:'railway',name:`${s.regions[selectedRegionId].name}–${s.regions[other].name} Railway`,fromId:selectedRegionId,toId:other,ownerCountryId:'asteria',regionId:selectedRegionId,cost:18,totalTurns:2},s);
    toast(r.ok?'Railway project started':r.error,r.ok?'good':'bad');
  }else{
    if(type==='port'&&selectedRegionId!=='eastern_coast'){toast('Port construction requires the eastern coast.','bad');return;}
    const defs={basic_factory:{name:'Basic Factory',cost:14,totalTurns:2},steelworks:{name:'Steelworks',cost:28,totalTurns:3},power_plant:{name:'Power Plant',cost:18,totalTurns:2},port:{name:'Port',cost:24,totalTurns:3}};
    const d=defs[type];if(!d){toast(`Unsupported facility ${type}`,'bad');return;}
    const r=Development.startProject({type,name:d.name,regionId:selectedRegionId,countryId:'asteria',cost:d.cost,totalTurns:d.totalTurns},s);
    toast(r.ok?`${r.project.name} project started`:r.error,r.ok?'good':'bad');
  }
  render();
}
function developDeposit(depositId){
  const r=Development.startMineDevelopment(depositId,{method:'state'},session.state);toast(r.ok?`${r.project.name} started`:r.error,r.ok?'good':'bad');render();
}
function upgradeFacility(facilityId){
  const r=Development.startFacilityUpgrade(facilityId,session.state);toast(r.ok?`${r.project.name} started`:r.error,r.ok?'good':'bad');render();
}
function upgradeConnection(connectionId){
  const r=Development.startConnectionUpgrade(connectionId,session.state);toast(r.ok?`${r.project.name} started`:r.error,r.ok?'good':'bad');render();
}
function setSignal(mode){
  const s=session.state;const c=s.cities.westhaven;if(!c)return;
  if(mode==='stress')s.citySignals[c.id]={populationPressure:-1,economicMomentum:-1,housingStress:1,conflictStress:1};
  if(mode==='recover')s.citySignals[c.id]={populationPressure:1,economicMomentum:1,housingStress:0,conflictStress:0};
  if(mode==='clear')delete s.citySignals[c.id];
  toast(mode==='clear'?'Urban signal cleared':`${mode} signal applied`);render();
}

function browserSelfCheck(){
  const checks=[];const push=(n,o)=>checks.push({n,o:!!o});
  push('8 embedded map images',Object.keys(MAP_IMAGES).length===8);
  push('selected map image resolved from image bundle',String($('mapImg').src).startsWith('data:image/webp;base64,'));
  push('2 initial city map objects',Object.keys(session.state.cities).includes('port_arlen')&&Object.keys(session.state.cities).includes('westhaven'));
  push('3 Model 1 region overlays',document.querySelectorAll('.region-card').length===3);
  push('city marker layer rendered',document.querySelectorAll('.city-marker').length>=2);
  push('1 turn = 1 year control',typeof Main.advanceOneYear==='function');
  push('new-city assessment exists',typeof Main._internals?.candidateFormationAssessment==='function');
  push('urban economic drivers exist',typeof Main._internals?.regionalUrbanDrivers==='function');
  push('31 saved Model 2 assets loaded from bundles',Object.keys(MODEL2_ASSETS).length===31);
  push('development visual layer rendered',!!$('developmentLayer')&&!!$('connectionLayer'));
  push('facility visual resolver exists',typeof window.BorderEpoch?.Model2Visuals?.visualAssetKey==='function');
  return checks;
}
window.runMainBoardSelfCheck=browserSelfCheck;

window.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;renderPanel();return;}
  const region=e.target.closest('[data-region]');if(region){selectedRegionId=region.dataset.region;selectedParcelId=null;activeTab=activeTab==='world'?'world':'development';render();return;}
  const city=e.target.closest('[data-city]');if(city){activeTab='cities';renderPanel();return;}
  const parcel=e.target.closest('[data-parcel]');if(parcel){selectedParcelId=parcel.dataset.parcel;renderPanel();return;}
  const ex=e.target.closest('[data-explore]');if(ex){startExplore(ex.dataset.explore);return;}
  const dd=e.target.closest('[data-develop-deposit]');if(dd){developDeposit(dd.dataset.developDeposit);return;}
  const uf=e.target.closest('[data-upgrade-facility]');if(uf){upgradeFacility(uf.dataset.upgradeFacility);return;}
  const uc=e.target.closest('[data-upgrade-connection]');if(uc){upgradeConnection(uc.dataset.upgradeConnection);return;}
  const b=e.target.closest('[data-build]');if(b){build(b.dataset.build);return;}
  const fm=e.target.closest('[data-force-map]');if(fm){forcedTemplate=fm.dataset.forceMap||null;initWorld(seedValue(),forcedTemplate);toast(forcedTemplate?`Forced ${forcedTemplate}`:'Random template mode');return;}
  const sig=e.target.closest('[data-signal]');if(sig){setSignal(sig.dataset.signal);return;}
});
window.addEventListener('change',e=>{
  if(e.target.id==='regionSelect'){selectedRegionId=e.target.value;selectedParcelId=null;render();}
  if(e.target.id==='resourceSelect'){selectedResource=e.target.value;renderPanel();}
  if(e.target.id==='showCandidates')renderMap();
});
$('advanceBtn').addEventListener('click',advanceYear);
$('newWorldBtn').addEventListener('click',()=>{forcedTemplate=null;initWorld(seedValue());toast('New deterministic world generated','good');});
$('randomSeedBtn').addEventListener('click',()=>{const seed=`be-${Math.random().toString(36).slice(2,10)}`;$('seedInput').value=seed;forcedTemplate=null;initWorld(seed);toast('Random seed generated','good');});

initWorld('border-epoch-2030');
setTimeout(()=>{const c=browserSelfCheck();window.__BE_BROWSER_CHECKS__=c;window.__BE_MODULE8_CHECKS__=window.BorderEpoch?.Module8?.validateIntegration?.()||{ok:false,errors:['Module8 unavailable']};console.log('Border Epoch browser self-check',c);console.log('Border Epoch Module 1-9 integration check',window.__BE_MODULE8_CHECKS__);},20);
</script></body></html>
