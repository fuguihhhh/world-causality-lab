function runSelfCheck(show=true){
 const checks=[];const add=(name,ok,detail)=>checks.push({name,ok,detail});ensureIndustrialState(S);ensureTransportState(S);ensureAgricultureState(S);
 add('Single annual clock',Number.isInteger(S.year)&&S.turn===S.year-2026,`year=${S.year}, turn=${S.turn}`);
 add('Resource ownership boundary',S.regions.every(r=>r.resources&&r.discovered)&&S.facilities.every(f=>!('resourceEndowment' in f)),'M1=endowment/discovery, M2=projects/facilities');
 add('Transport links are real region pairs',S.transportLinks.every(l=>l.fromRegionId!==l.toRegionId&&!!region(l.fromRegionId)&&!!region(l.toRegionId)),`links=${S.transportLinks.length}`);
 const linkKeys=S.transportLinks.map(l=>`${transportPairKey(l.fromRegionId,l.toRegionId)}|${l.type}`);add('No duplicate road/rail links',new Set(linkKeys).size===linkKeys.length,`unique=${new Set(linkKeys).size}/${linkKeys.length}`);
 add('Road and rail are different modes',transportBaseCapacity('rail',1)>transportBaseCapacity('road',1)*3&&transportBaseModeCost('rail','coal')<transportBaseModeCost('road','coal'),'rail = high-capacity/low bulk cost; road = flexible lower-capacity');
 const multi=findTransportRoute('R1','R6','coal',S,{ignoreCapacity:true});add('Transport supports multi-hop routes',!!multi&&multi.route.length>=2,multi?multi.route.join(' → '):'no route');
 add('Transport capacity is finite',S.transportLinks.every(l=>Number.isFinite(transportEffectiveCapacity(l,S))&&transportEffectiveCapacity(l,S)>=0),'every live link has finite annual capacity');
 add('Transport state and condition are separated',S.transportLinks.every(l=>typeof l.condition==='number'&&typeof l.state==='string'&&typeof l.baseCapacity==='number'),'condition/state/baseCapacity stored independently');
 add('Transport construction is project-based',S.transportProjects.every(p=>typeof p.progress==='number'&&p.totalCost>0&&p.annualBudget>0),'no click-to-instant rail/road flag');
 add('Agriculture unified projects',Array.isArray(S.agricultureProjects)&&S.agricultureProjects.every(p=>['private','state'].includes(p.ownerType)),'private and state farms share AgricultureProject model');
 add('Agriculture farm inventory conservation',Object.values(S.agriculture.reports||{}).every(r=>Math.abs(r.conservationError||0)<1e-6),'opening + harvest = seed reserve + spoilage + dispatch + closing');
 add('Agriculture non-negative states',S.agricultureProjects.every(p=>(p.actualArea||0)>=-1e-9)&&Object.values(S.agriculture.farmInventories).every(fi=>Object.values(fi.stocks).every(x=>x>=-1e-9)),'no negative land or farm stock');
 add('Agriculture delivery bounded by farm stock',Object.values(S.agriculture.reports||{}).every(r=>r.marketDeliveredQuantity>=-1e-9&&r.storageLoss>=-1e-9&&r.farmClosingStock>=-1e-9),'dispatch/loss/carryover remain non-negative');
 add('Agriculture market delivery boundary',(S.agriculture.inventoryTransactions||[]).every(x=>x.type==='agricultureMarketDelivery'),'only marketDeliveredQuantity enters regional market inventory');
 add('Agriculture inputs are explicit',Object.values(cropDefs).every(c=>c.seedPerArea>0&&c.fertilizerPerArea>0&&c.fuelPerArea>0&&!('seedGoodsPerArea' in c)),'seed / fertilizer / fuel no longer alias manufactured goods');
 add('Agriculture logistics is capacity-based',typeof calculateLocalTransportCapacity==='function'&&typeof resolveFarmToMarketTransport==='function','road creates quantity/year capacity, not field loss');
 add('Agriculture state/private finance shared treasury',typeof S.treasury==='number'&&!('agricultureTreasury' in S),'no second treasury created');
 for(const t of runAgricultureSelfTests())add(t.name,t.ok,t.detail);
 add('AI uses trade rules',typeof module5ExecuteExport==='function','M6 calls Module 5 export transaction API');
 add('No duplicate trade settlement',S.tradeContracts.every(c=>!(c.status==='delivered'&&!c.settled)),'delivered contracts are settled exactly once');
 add('Fuel → motorized road loop',S.motorization.level<2||typeof S.stats.roadEff==='number',`motor L${S.motorization.level}, roadEff=${S.stats.roadEff}`);
 const mapPack=window.__BE_MAP_IMAGES__||{},slots=mapSlots(),availableMaps=slots.filter(x=>x.available).length,mapReady=!!mapAssetForKey(S.mapKey||'map_01');
 add('Ten-map selector restored',$('mapSelect')&&$('mapSelect').options.length===10,`slots=${$('mapSelect')?.options.length||0}; available=${availableMaps}/10; source=world-causality-lab-assets-*.js`);
 add('Full terrain image visible',mapReady&&$('mapBaseImg')&&!$('mapBaseImg').hidden,`map=${S.mapKey||'map_01'}; visible=${!$('mapBaseImg').hidden}`);
 const resolvable=S.facilities.filter(f=>f.status==='active'&&!!facilityAssetUrl(f)).length,shown=$('worldMap').querySelectorAll('.facilityImage').length;
 add('Facility image assets visible',shown===resolvable&&shown>0,`resolved=${resolvable}; rendered=${shown}; active=${S.facilities.filter(f=>f.status==='active').length}`);
 add('Single selected parcel outline',$('worldMap').querySelectorAll('.parcel').length===(S.showParcels?1:0),`outlines=${$('worldMap').querySelectorAll('.parcel').length}; invisible hitboxes=${$('worldMap').querySelectorAll('.region').length}`);
 add('Transport map layer',!!$('worldMap').querySelector('#transportLayer')&&$('worldMap').querySelectorAll('[data-transport-hit]').length===S.transportLinks.length,`rendered links=${$('worldMap').querySelectorAll('[data-transport-hit]').length}/${S.transportLinks.length}`);
 add('Independent city layer',!!$('worldMap').querySelector('#cityLayer')&&$('worldMap').querySelectorAll('.cityMarker').length===S.regions.filter(r=>r.city||r.port).length,`cities=${$('worldMap').querySelectorAll('.cityMarker').length}`);
 add('Resource UI visibility',document.querySelector('[data-view="resources"]')!==null,'resource entry exists');
 add('Agriculture UI visibility',document.querySelector('[data-view="agriculture"]')!==null,'agriculture entry exists');
 add('Trade UI visibility',document.querySelector('[data-view="trade"]')!==null,'trade entry exists');
 add('Map has six regions',$('worldMap').querySelectorAll('.region').length===6,`regions=${$('worldMap').querySelectorAll('.region').length}`);
 add('Projects have visible markers',!S.showProjects||S.projects.filter(p=>p.status==='building').length===$('worldMap').querySelectorAll('.marker .project').length,`building=${S.projects.filter(p=>p.status==='building').length}`);
 add('No hidden active mine',S.facilities.filter(f=>['oil_field','coal_mine','iron_mine'].includes(f.type)).every(f=>!!region(f.regionId)),'every mine has a map region');
 add('Facility visual stage',S.facilities.filter(f=>f.status==='active').every(f=>$('worldMap').textContent.includes(`${fn(f.type)} L${f.level}`)),'map label follows facility level');
 add('Event evidence integrity',S.events.every(e=>Array.isArray(e.evidence)),'events carry evidence arrays');
 S.debug.last=checks;window.__BE_SELF_CHECK__=checks;if(show)renderContext();return checks;
}

 document.querySelectorAll('[data-link-upgrade]').forEach(b=>b.onclick=()=>{const res=startTransportUpgrade(b.dataset.linkUpgrade,$('transportIntensity')?.value||'normal',S);toast(res.ok?(S.lang==='zh'?'线路升级项目已启动。':'Link upgrade started.'):(res.error||'Error'));render()});
 document.querySelectorAll('[data-link-repair]').forEach(b=>b.onclick=()=>{const res=startTransportRepair(b.dataset.linkRepair,.90,S);toast(res.ok?(S.lang==='zh'?'线路维修项目已启动。':'Link repair started.'):(res.error||'Error'));render()});
 document.querySelectorAll('[data-explore]').forEach(b=>b.onclick=()=>explore(S.selectedRegion,b.dataset.explore));document.querySelectorAll('[data-maintain]').forEach(b=>b.onclick=()=>maintainFacility(b.dataset.maintain));document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>upgradeFacility(b.dataset.upgrade));document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{S.selectedRegion=b.dataset.region;render()});document.querySelectorAll('[data-quote]').forEach(b=>b.onclick=()=>getQuotes(b.dataset.quote));document.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>{const [g,i]=b.dataset.import.split(':');orderImport(g,+i,5)});
 if($('motor2Btn'))$('motor2Btn').onclick=startMotor2;
 if($('createStateAg'))$('createStateAg').onclick=()=>{const res=createStateAgricultureProject({regionId:S.selectedRegion,projectType:$('stateAgType').value,cropId:$('stateAgCrop').value,plannedArea:Number($('stateAgArea').value)||20},S);toast(res.ok?(S.lang==='zh'?'国家农业项目已启动。':'State agriculture project started.'):(res.error||'Error'));render()};
 document.querySelectorAll('[data-ag-policy]').forEach(b=>b.onclick=()=>{const [k,delta]=b.dataset.agPolicy.split(':');const cur=Number(S.agriculture.policy[k])||0;setAgriculturePolicy({[k]:cur+Number(delta)},S);renderContext()});
 document.querySelectorAll('[data-state-ag-action]').forEach(b=>b.onclick=()=>{const [id,action]=b.dataset.stateAgAction.split(':');const res=manageStateAgricultureProject(id,action,S);toast(res.ok?(S.lang==='zh'?'国家农业项目已调整。':'State agriculture project updated.'):(res.error||'Error'));render()});
 if($('reserveBuy'))$('reserveBuy').onclick=()=>{const res=purchaseForReserve(S.selectedRegion,10,S);toast(res.ok?(S.lang==='zh'?`已采购 ${res.quantity.toFixed(1)}。`:`Purchased ${res.quantity.toFixed(1)}.`):(res.error||'Error'));render()};
 if($('runCheck'))$('runCheck').onclick=()=>runSelfCheck(true);if($('restartBtn'))$('restartBtn').onclick=()=>{if(confirm(S.lang==='zh'?'重开会清除当前局面，确定？':'Restart and clear the current run?')){S=makeInitialState();render()}};if($('exportBtn'))$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='world-lab-state.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}
function render(){ensureIndustrialState(S);ensureAgricultureState(S);ensureTransportState(S);document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));renderTop();renderNav();renderSituation();renderTutorial();renderMap();renderContext()}
function runRerenderRegression(){
 const originalMap=S.mapKey,originalRegion=S.selectedRegion,results=[];
 const check=(name,ok,detail='')=>results.push({name,ok:!!ok,detail});
 try{
   const expectedCities=S.regions.filter(r=>r.city||r.port).length;
   for(const slot of mapSlots()){
     if(!slot.available)continue;
     S.mapKey=slot.key;renderMap();
     check(`map switch ${slot.key}`,$('mapBaseImg')&&!$('mapBaseImg').hidden&&$('worldMap').querySelectorAll('.cityMarker').length===expectedCities,`cities=${$('worldMap').querySelectorAll('.cityMarker').length}`);
   }
   for(const r of S.regions){S.selectedRegion=r.id;renderMap();check(`parcel ${r.id}`,$('worldMap').querySelectorAll('.parcel').length===(S.showParcels?1:0)&&$('worldMap').querySelector(`[data-selected-parcel="${r.id}"]`)!=null,'single-outline');}
   renderMap();
   check('facility layer survives rerender',$('worldMap').querySelector('#facilityLayer')!=null,`facilityImages=${$('worldMap').querySelectorAll('.facilityImage').length}`);
   check('city layer survives rerender',$('worldMap').querySelectorAll('.cityMarker').length===S.regions.filter(r=>r.city||r.port).length,`cities=${$('worldMap').querySelectorAll('.cityMarker').length}`);
 }finally{S.mapKey=originalMap;S.selectedRegion=originalRegion;renderMap();}
 window.__BE_RERENDER_REGRESSION__=results;return results;
}
function save(){localStorage.setItem('world-causality-lab-v1-save',JSON.stringify(S));toast(S.lang==='zh'?'已保存到本机浏览器。':'Saved in this browser.')}
function load(){try{const raw=localStorage.getItem('world-causality-lab-v1-save');if(!raw){toast(S.lang==='zh'?'没有找到存档。':'No save found.');return}S=JSON.parse(raw);if(!S.mapKey)S.mapKey='map_01';ensureIndustrialState(S);ensureAgricultureState(S);ensureTransportState(S);__assetIndex=null;render();toast(S.lang==='zh'?'存档已读取。':'Save loaded.')}catch(e){showError(e)}}
function showError(e){const el=$('errorbar');el.style.display='block';el.textContent='Runtime error: '+(e&&e.message?e.message:String(e));window.__BE_RUNTIME_ERROR__=String(e)}
window.addEventListener('error',e=>showError(e.error||e.message));window.addEventListener('unhandledrejection',e=>showError(e.reason));
$('langBtn').onclick=()=>{S.lang=S.lang==='zh'?'en':'zh';render()};$('saveBtn').onclick=save;$('loadBtn').onclick=load;$('advanceBtn').onclick=advanceYear;$('toggleParcelsBtn').onclick=()=>{S.showParcels=!S.showParcels;renderMap();runSelfCheck(false)};$('toggleResourcesBtn').onclick=()=>{S.showResources=!S.showResources;renderMap()};$('toggleProjectsBtn').onclick=()=>{S.showProjects=!S.showProjects;renderMap();runSelfCheck(false)};
window.WorldLab={getState:()=>deepClone(S),Agriculture:window.Agriculture,Transport:window.Transport,advanceYear,setView,setRegion,setMap,startProject,explore,getQuotes,orderImport,runSelfCheck,runRerenderRegression,refreshAssets:()=>{__assetIndex=null;buildAssetIndex(true);renderMap();return runSelfCheck(false)},reset:()=>{S=makeInitialState();render()}};
render();runSelfCheck(false);renderContext();
})();
