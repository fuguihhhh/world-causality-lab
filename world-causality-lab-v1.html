 if(typeof v==='string' && (/^data:image\//i.test(v)||/^blob:/i.test(v)||/^https?:/i.test(v)||/^\.\.?\//.test(v)||/\.(png|webp|jpe?g|svg)(\?|#|$)/i.test(v)))return v;
 if(v&&typeof v==='object'){for(const k of ['src','url','uri','data','image','href','dataUri','dataURL']){const x=v[k];if(typeof x==='string'&&x)return normalizeAsset(x)}}
 return null;
}
let __assetIndex=null;
function assetRoots(){
 const roots=[];
 const add=(name,v)=>{if(v&&(typeof v==='object'||typeof v==='function'))roots.push({name,v})};
 add('__BE_MAP_IMAGES__',window.__BE_MAP_IMAGES__);
 for(const k of ['__BE_MODULE2_ASSETS__','__BE_MODEL2_ASSETS__','__BE_DEVELOPMENT_ASSETS__','__BE_ASSETS__','MODULE2_ASSETS','MODEL2_ASSETS','BorderEpochAssets','WorldLabAssets']){try{add(k,window[k])}catch(_){}}
 try{add('BorderEpoch',window.BorderEpoch)}catch(_){}
 try{if(typeof MODULE2_ASSETS!=='undefined')add('MODULE2_ASSETS_LEXICAL',MODULE2_ASSETS)}catch(_){}
 try{if(typeof MODEL2_ASSETS!=='undefined')add('MODEL2_ASSETS_LEXICAL',MODEL2_ASSETS)}catch(_){}
 try{if(typeof DEVELOPMENT_ASSETS!=='undefined')add('DEVELOPMENT_ASSETS_LEXICAL',DEVELOPMENT_ASSETS)}catch(_){}
 for(const k of Object.getOwnPropertyNames(window)){
   if(!/(?:^__BE_|BorderEpoch|WorldLab|Asset|Assets|ImageBundle|Module2|Model2)/i.test(k))continue;
   try{const v=window[k];if(v&&v!==window&&!(v instanceof Element))add(k,v)}catch(_){}
 }
 return roots;
}
function buildAssetIndex(force=false){
 if(__assetIndex&&!force)return __assetIndex;
 const index=new Map(),seen=new Set(),queue=assetRoots().map(x=>({path:x.name,v:x.v,d:0}));let visited=0;
 while(queue.length&&visited<7000){
   const {path,v,d}=queue.shift();visited++;
   if(v==null)continue;
   const direct=normalizeAsset(v);
   if(direct){const key=path.split('.').pop();index.set(String(key).toLowerCase(),direct);index.set(path.toLowerCase(),direct);continue}
   if((typeof v!=='object'&&typeof v!=='function')||seen.has(v)||d>4)continue;
   seen.add(v);
   let keys=[];try{keys=Object.keys(v).slice(0,500)}catch(_){continue}
   for(const k of keys){
     let child;try{child=v[k]}catch(_){continue}
     const childPath=path+'.'+k;
     const u=normalizeAsset(child);
     if(u){index.set(String(k).toLowerCase(),u);index.set(childPath.toLowerCase(),u)}
     else if(child&&d<4&&(typeof child==='object'||typeof child==='function')&&!(child instanceof Element))queue.push({path:childPath,v:child,d:d+1});
   }
 }
 __assetIndex=index;return index;
}
function assetByKey(key){
 if(!key)return null;
 const norm=String(key).toLowerCase(),idx=buildAssetIndex();
 if(idx.has(norm))return idx.get(norm);
 for(const [k,u] of idx){if(k.endsWith('.'+norm)||k.endsWith('/'+norm))return u}
 const tokens=norm.replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(x=>x.length>1&&!['image','asset','assets','visual','level'].includes(x));
 let best=null,bestScore=-1;
 if(tokens.length){
   for(const [k,u] of idx){let score=0;for(const t of tokens)if(k.includes(t))score++;if(score===tokens.length&&score>bestScore){best=u;bestScore=score}}
 }
 return best;
}
function mapAssetForKey(key){
 const maps=window.__BE_MAP_IMAGES__||{};
 return normalizeAsset(maps[key])||assetByKey(key);
}

const VISUAL_STAGES={
 coal_mine:['small_coal_mine','mechanized_coal_mine','industrial_coal_mine','deep_mining_complex','national_mining_complex'],

function visualResolverResult(f){
 const v=window.BorderEpoch&&window.BorderEpoch.Module2Visuals;
 if(!v)return null;
 for(const name of ['visualAsset','resolveAsset','getAsset','facilityAsset','getFacilityAsset','visualAssetKey']){
   const fun=v&&v[name];if(typeof fun!=='function')continue;
   const calls=[[f,S],[f],[f.type,f.level,f.visualStage,S],[f.type,f.level]];
   for(const args of calls){try{const out=fun.apply(v,args);const direct=normalizeAsset(out);if(direct)return direct;if(typeof out==='string'){const by=assetByKey(out);if(by)return by}}catch(_){}}
 }
 return null;
}
function facilityAssetCandidates(f){
 const lvl=Math.max(1,Math.min(5,Number(f.level)||1)),out=[];
 if(f.visualStage)out.push(f.visualStage);
 if(VISUAL_STAGES[f.type])out.push(VISUAL_STAGES[f.type][Math.min(lvl,VISUAL_STAGES[f.type].length)-1]);
 if(f.type==='oil_field'){
   const a=[
    ['small_oil_field','oil_field_small','oil_well','oil_field_l1'],
    ['mechanized_oil_field','developed_oil_field','oil_field_l2','oilfield_level_2'],
    ['industrial_oil_field','expanded_oil_field','oil_field_l3','oilfield_level_3'],
    ['major_oil_field','integrated_oil_field','oil_field_l4','oilfield_level_4'],
    ['national_oil_complex','giant_oil_field','oil_field_l5','oilfield_level_5']
   ];out.push(...a[lvl-1]);
 }
 if(f.type==='farm'){
   const r=region(f.regionId),crop=(r&&(r.crop!=='auto'?r.crop:r.lastCrop))||'wheat';
   out.push(`${crop}_farm`,`${crop}_field`,`farm_${crop}`,`farmland_${crop}`,`cropland_${crop}`,'farm','farmland','cropland','agriculture');
 }
 const aliases={coal_mine:'coal',iron_mine:'iron',oil_field:'oil',steel:'steelworks',power:'power_plant',road:'road'};
 out.push(`${f.type}_l${lvl}`,`${f.type}_${lvl}`,`${f.type}_level_${lvl}`,f.type);
 if(aliases[f.type])out.push(`${aliases[f.type]}_l${lvl}`,`${aliases[f.type]}_${lvl}`,aliases[f.type]);
 return [...new Set(out.filter(Boolean))];
}
function facilityAssetUrl(f){

function totalPop(){return S.regions.reduce((a,r)=>a+r.pop,0)}

 if(S.motorization.upgrading){S.motorization.progress++;if(S.motorization.progress>=S.motorization.years){S.motorization.level=2;S.motorization.upgrading=false;addEvent('motorization','info','机动车化 II 已投入运行','Motorization II is operational',['Module 2 technology path','Oil demand now affects road efficiency'])}}

function facilityOutput(f){
 const r=region(f.regionId);const condition=f.condition/100;const laborFactor=clamp(r.labor/(r.pop*.5),.45,1.05);const transportFactor=clamp((r.road*S.stats.roadEff)/60,.35,1.25);const energyFactor=clamp(r.power/60,.35,1.2);const financeFactor=S.treasury>=0?1:.75;let base=0,out=null,input=null;
 if(f.type==='oil_field'){base=10;out='oil'}if(f.type==='coal_mine'){base=13;out='coal'}if(f.type==='iron_mine'){base=11;out='iron'}if(f.type==='steel'){base=9;out='goods';input={iron:5,coal:3}}
 if(!out)return null;base*=1+.55*(Math.max(1,f.level)-1);let inputFactor=1;if(input){for(const [g,n] of Object.entries(input))inputFactor=Math.min(inputFactor,clamp(r.inventory[g]/n,0,1))}
 const demandFactor=out==='goods'?clamp(needs('goods')/Math.max(1,total('goods')),.55,1.15):1;
 const factor=Math.min(laborFactor,transportFactor,energyFactor,financeFactor,inputFactor,demandFactor,condition);const qty=base*factor;
 if(input&&qty>0){for(const [g,n] of Object.entries(input))r.inventory[g]=Math.max(0,r.inventory[g]-n*factor)}
 r.inventory[out]+=qty;return {out,qty,factors:{laborFactor,transportFactor,energyFactor,financeFactor,inputFactor,demandFactor,condition}};
}
function module3RepriceRegion(r){
 const localNeed={food:r.pop*.075,oil:1.5,coal:2.2,iron:1.5,goods:2.7};for(const g of goods){const ratio=localNeed[g]/Math.max(1,r.inventory[g]);r.prices[g]=clamp(r.prices[g]*(1+(ratio-1)*.07),.55,3.8)}
}

}

function annualModule4(){
 S.sequenceLog.push('M4 population');
 const before=S.regions.map(r=>r.pop);for(const r of S.regions){const foodFactor=clamp(r.inventory.food/(r.pop*.06),.5,1.15);const houseFactor=clamp(r.housing/r.pop,.72,1.12);const growth=.006+(foodFactor-1)*.01+(houseFactor-1)*.008;const births=r.pop*.015;const deaths=r.pop*(.009-growth);r.pop=Math.max(60,r.pop+births-deaths);r.age.young=clamp(r.age.young+.0005-.0004*r.satisfaction/60,.16,.28);r.age.old=clamp(r.age.old+.0012,.1,.25);r.age.working=1-r.age.young-r.age.old;r.labor=r.pop*r.age.working*(1-r.unemployment/100);const pressure=r.pop/r.housing;r.satisfaction=clamp(66-(pressure-1)*28-(r.prices.food-1)*9-r.unemployment*.35,25,90);}
 // Migration uses one score pass only, preventing duplicate satisfaction penalties.
 const scores=S.regions.map(r=>({r,score:r.satisfaction+r.road*.12-r.prices.food*4}));const hi=[...scores].sort((a,b)=>b.score-a.score)[0],lo=[...scores].sort((a,b)=>a.score-b.score)[0];if(hi.r.id!==lo.r.id&&hi.score-lo.score>10){const move=Math.min(lo.r.pop*.008,(hi.score-lo.score)*.12);lo.r.pop-=move;hi.r.pop+=move;addEvent('migration','info',`${rn(lo.r)}向${rn(hi.r)}迁移约 ${move.toFixed(1)}`,`About ${move.toFixed(1)} migrated from ${rn(lo.r)} to ${rn(hi.r)}`,[`Satisfaction gap ${(hi.score-lo.score).toFixed(1)}`,`Housing checked once`])}
 for(const [i,r] of S.regions.entries()){const delta=r.pop-before[i];r.cityTrend=delta;if(!r.city&&r.pop>470&&r.road>50){r.city=true;addEvent('city','info',`${rn(r)}形成新城市节点`,`${rn(r)} formed a new urban node`,['Population threshold','Transport threshold'])}if(r.city&&r.pop<260&&r.road<32){r.city=false;addEvent('citydecline','warn',`${rn(r)}失去城市节点`,`${rn(r)} lost urban-node status`,['Population decline','Transport decline'])}}
}
function annualModule5(){
 S.sequenceLog.push('M5 trade');let tradeTax=0;
 for(const c of S.tradeContracts.filter(c=>c.status==='pending'&&!c.settled)){
   const supplier=S.ai.find(a=>a.id===c.supplier),port=region(c.port),cost=c.qty*c.unit,tariff=cost*.06;
   if(!supplier||supplier.stock[c.good]<c.qty){c.status='failed';continue}
   if(S.treasury<cost+tariff){c.status='failed';addEvent('tradefail','warn',`${gn(c.good)}进口合同因资金不足失败`,`Import contract for ${gn(c.good)} failed for lack of funds`,[`Required ${(cost+tariff).toFixed(1)}`]);continue}
   S.treasury-=cost+tariff;supplier.money+=cost;supplier.stock[c.good]-=c.qty;port.inventory[c.good]+=c.qty;c.status='delivered';c.settled=true;tradeTax+=tariff;S.dependencies[c.good]=clamp(S.dependencies[c.good]*.7+(c.qty/Math.max(1,needs(c.good)))*30,0,100);S.relations[c.supplier]=clamp(S.relations[c.supplier]+1,0,100);
   addEvent('trade','info',`${c.qty} 单位${gn(c.good)}经${rn(port)}到货`,`${c.qty} ${gn(c.good)} delivered through ${rn(port)}`,[`Supplier ${c.supplier}`,`Route ${c.route}`,`Paid ${(cost+tariff).toFixed(1)}`]);
 }
 S.fiscal.tradeTax=tradeTax; // tariffs are recorded as domestic fiscal revenue rather than charged twice.
 S.treasury+=tradeTax;
 // Module 5 changes inventories; Module 3 retains price ownership and receives a post-trade repricing pass.
 for(const r of S.regions)module3RepriceRegion(r);S.sequenceLog.push('M3 post-trade prices');
}
function module5ExecuteExport(buyerId,g,qty){
 const buyer=S.ai.find(a=>a.id===buyerId);if(!buyer||qty<=0)return false;const reserve=needs(g)*.55;const sellable=Math.max(0,total(g)-reserve);if(sellable<=0)return false;let actual=Math.min(qty,sellable);const avgPrice=S.regions.reduce((a,r)=>a+r.prices[g],0)/S.regions.length;const unit=avgPrice*1.03;actual=Math.min(actual,buyer.money/unit);if(actual<=.05)return false;let left=actual;for(const r of [...S.regions].sort((a,b)=>b.inventory[g]-a.inventory[g])){const take=Math.min(left,r.inventory[g]);r.inventory[g]-=take;left-=take;if(left<=.001)break}const revenue=actual*unit;buyer.money-=revenue;buyer.stock[g]+=actual;const tax=revenue*.08;S.treasury+=tax;S.fiscal.tradeTax+=tax;S.relations[buyerId]=clamp(S.relations[buyerId]+.4,0,100);return true;
}
function annualModule6(){

function renderAgriculture(){const r=selected();let html=sectionHead(tr('agriculture'),S.lang==='zh'?'玩家每年选择“在哪里种什么”；不选择则保持默认计划。':'Choose what to plant and where each year; no choice keeps the default plan.');html+=`<h3>${rn(r)} · ${tr('cropPlan')}</h3><div class="statusCard"><select class="select" id="cropSelect"><option value="auto">${tr('autoPlan')}</option>${Object.keys(cropDefs).map(c=>`<option value="${c}" ${r.crop===c?'selected':''}>${tr(c)}</option>`).join('')}</select><div class="statusBody">${S.lang==='zh'?`上年作物：${tr(r.lastCrop)}。选择会在下一次年度 tick 真实影响粮食与收入。`:`Last crop: ${tr(r.lastCrop)}. The plan changes food and income on the next annual tick.`}</div></div><div class="divider"></div><h3>${S.lang==='zh'?'各区域计划':'Regional plans'}</h3><div class="list">${S.regions.map(x=>`<div class="row"><div class="left"><div class="title">${rn(x)}</div><div class="desc">${tr('cropPlan')}: ${x.crop==='auto'?tr('autoPlan'):tr(x.crop)}</div></div><button class="btn" data-region="${x.id}">${S.lang==='zh'?'选择':'Select'}</button></div>`).join('')}</div>`;return html}
function renderTrade(){let html=sectionHead(tr('trade'),S.lang==='zh'?'国内缺口 → 国外报价 → 数量 → 真实口岸/路线 → 年度结算 → 库存/价格/依赖变化。':'Domestic gap → foreign quote → quantity → real port/route → annual settlement → inventory/price/dependence.');html+=`<div class="list">`;for(const g of goods){const gap=Math.max(0,needs(g)-total(g));html+=`<div class="row"><div class="left"><div class="title">${gn(g)} · ${tr('tradeGap')} ${gap.toFixed(1)}</div><div class="desc">${tr('inventory')} ${total(g).toFixed(1)} / ${needs(g).toFixed(1)} · ${tr('dependency')} ${S.dependencies[g].toFixed(0)}%</div></div><button class="btn" data-quote="${g}">${tr('getQuote')}</button></div>`;if((S.quotes[g]||[]).length){html+=`<div class="statusCard">${S.quotes[g].map((q,i)=>`<div class="row"><div class="left"><div class="title">${q.supplier} · ${q.unit}/u</div><div class="desc">${tr('port')}: ${rn(region(q.port))} · ${tr('route')}: ${q.route} · max ${q.qty}</div></div><button class="btn primary" data-import="${g}:${i}">${tr('import5')}</button></div>`).join('')}</div>`}}html+=`</div><div class="divider"></div><h3>${tr('pending')}</h3><div class="list">${S.tradeContracts.slice().reverse().slice(0,8).map(c=>`<div class="row"><div class="left"><div class="title">${gn(c.good)} ×${c.qty} · ${c.supplier}</div><div class="desc">${rn(region(c.port))} · ${c.route}</div></div><span class="tag ${c.status==='delivered'?'ok':c.status==='failed'?'bad':'warn'}">${c.status}</span></div>`).join('')||`<div class="small muted">—</div>`}</div>`;return html}
function renderDiplomacy(){return sectionHead(tr('diplomacy'),tr('aiRule'))+`<div class="list">${S.ai.map(a=>`<div class="row"><div class="left"><div class="title">${a.id}</div><div class="desc">${tr('relation')} ${S.relations[a.id].toFixed(0)} · ${S.lang==='zh'?'原型':'profile'} ${a.profile}</div></div><span class="tag">${S.relations[a.id]>=55?(S.lang==='zh'?'合作':'cooperative'):S.relations[a.id]>=40?(S.lang==='zh'?'中性':'neutral'):(S.lang==='zh'?'紧张':'tense')}</span></div>`).join('')}</div><div class="divider"></div><h3>${tr('dependency')}</h3><div class="kv">${goods.map(g=>`<span>${gn(g)}</span><b>${S.dependencies[g].toFixed(0)}%</b>`).join('')}</div>`}
function renderEconomy(){const r=selected();return sectionHead(tr('economy'),S.lang==='zh'?'生产不能只看“有工厂+有原料”；劳动力、能源、运输、需求、库存、资金共同约束。':'Production is jointly constrained by labor, energy, transport, demand, inventory and finance.')+`<h3>${rn(r)}</h3><div class="grid2">${metric(tr('labor'),r.labor.toFixed(0),`pop ${r.pop.toFixed(0)}`)}${metric(tr('energy'),r.power.toFixed(0))}${metric(tr('transport'),(r.road*S.stats.roadEff).toFixed(0),`road ${r.road}`)}${metric(tr('finance'),money(S.treasury))}</div><div class="divider"></div><h3>${tr('localMarkets')}</h3><div class="kv">${goods.map(g=>`<span>${gn(g)}</span><b>${r.prices[g].toFixed(2)} · ${r.inventory[g].toFixed(1)}</b>`).join('')}</div><div class="divider"></div><h3>${tr('fiscal')}</h3><div class="kv"><span>${S.lang==='zh'?'工资/消费税收':'Tax from activity'}</span><b>${money(S.fiscal.tax)}</b><span>${S.lang==='zh'?'贸易关税':'Trade tariff'}</span><b>${money(S.fiscal.tradeTax)}</b><span>${S.lang==='zh'?'政府建设支出':'Project spending'}</span><b>${money(S.fiscal.spending)}</b></div>`}
function renderSociety(){const r=selected();return sectionHead(tr('society'),S.lang==='zh'?'年龄结构、住房、迁移、满意度使用同一年度人口状态，避免重复计分。':'Age, housing, migration and satisfaction use one annual population state to avoid double counting.')+`<h3>${rn(r)}</h3><div class="grid2">${metric(tr('population'),r.pop.toFixed(0))}${metric(tr('housing'),r.housing.toFixed(0))}${metric(S.lang==='zh'?'满意度':'Satisfaction',r.satisfaction.toFixed(0))}${metric(S.lang==='zh'?'失业率':'Unemployment',r.unemployment.toFixed(1)+'%')}</div><div class="divider"></div><h3>${tr('age')}</h3><div class="kv"><span>${S.lang==='zh'?'少年':'Young'}</span><b>${(r.age.young*100).toFixed(1)}%</b><span>${S.lang==='zh'?'劳动年龄':'Working'}</span><b>${(r.age.working*100).toFixed(1)}%</b><span>${S.lang==='zh'?'老年':'Old'}</span><b>${(r.age.old*100).toFixed(1)}%</b></div><div class="divider"></div><h3>${tr('migration')}</h3><div class="statusCard"><div class="statusBody">${S.lang==='zh'?`本年城市趋势：${r.cityTrend>=0?'+':''}${r.cityTrend.toFixed(1)}。新城出现需要人口和交通共同满足；旧城也会在长期衰退时消失。`:`Urban trend: ${r.cityTrend>=0?'+':''}${r.cityTrend.toFixed(1)}. New cities require both population and transport; declining cities can disappear.`}</div></div>`}
function renderEvents(){return sectionHead(tr('events'),S.lang==='zh'?'事件来自真实世界输出；只“发现故事”，不随机脑补因果。':'Events are discovered from simulation outputs; causal stories are not invented at random.')+`<div class="list">${S.events.length?S.events.map(e=>`<div class="statusCard ${e.severity==='bad'?'bad':e.severity==='warn'?'attn':''}"><div class="statusTitle"><span>${S.lang==='zh'?e.zh:e.en}</span><span class="tag">${e.year}</span></div><div class="statusBody">${tr('eventEvidence')}: ${e.evidence.map(esc).join(' · ')||'—'}</div></div>`).join(''):`<div class="small muted">${S.lang==='zh'?'推进年度后，系统会根据真实变化发现事件。':'Advance a year to discover situations from real changes.'}</div>`}</div>`}
function runSelfCheck(show=true){
 const checks=[];const add=(name,ok,detail)=>checks.push({name,ok,detail});
 add('Single annual clock',Number.isInteger(S.year)&&S.turn===S.year-2026,`year=${S.year}, turn=${S.turn}`);
 add('Resource ownership boundary',S.regions.every(r=>r.resources&&r.discovered)&&S.facilities.every(f=>!('resourceEndowment' in f)),'M1=endowment/discovery, M2=projects/facilities');
 add('Agriculture single owner',S.facilities.filter(f=>f.type==='farm').every(f=>f.status==='active'),'M9 owns crop output; M3 does not produce farm output');
 add('AI uses trade rules',typeof module5ExecuteExport==='function','M6 calls Module 5 export transaction API');
 add('No duplicate trade settlement',S.tradeContracts.every(c=>!(c.status==='delivered'&&!c.settled)),'delivered contracts are settled exactly once');
 add('Oil → road loop',S.motorization.level<2||typeof S.stats.roadEff==='number',`motor L${S.motorization.level}, roadEff=${S.stats.roadEff}`);
 const mapPack=window.__BE_MAP_IMAGES__||{},slots=mapSlots(),availableMaps=slots.filter(x=>x.available).length,mapReady=!!mapAssetForKey(S.mapKey||'map_01');
 add('Ten-map selector restored',$('mapSelect')&&$('mapSelect').options.length===10,`slots=${$('mapSelect')?.options.length||0}; available=${availableMaps}/10; source=world-causality-lab-assets-*.js`);
 add('Full terrain image visible',mapReady&&$('mapBaseImg')&&!$('mapBaseImg').hidden,`map=${S.mapKey||'map_01'}; visible=${!$('mapBaseImg').hidden}`);
 const resolvable=S.facilities.filter(f=>f.status==='active'&&!!facilityAssetUrl(f)).length,shown=$('worldMap').querySelectorAll('.facilityImage').length;
 add('Facility image assets visible',shown===resolvable&&shown>0,`resolved=${resolvable}; rendered=${shown}; active=${S.facilities.filter(f=>f.status==='active').length}`);
 add('Single selected parcel outline',$('worldMap').querySelectorAll('.parcel').length===(S.showParcels?1:0),`outlines=${$('worldMap').querySelectorAll('.parcel').length}; invisible hitboxes=${$('worldMap').querySelectorAll('.region').length}`);
 add('Independent city layer',!!$('worldMap').querySelector('#cityLayer')&&$('worldMap').querySelectorAll('.cityMarker').length===S.regions.filter(r=>r.city||r.port).length,`cities=${$('worldMap').querySelectorAll('.cityMarker').length}`);
 add('Resource UI visibility',document.querySelector('[data-view="resources"]')!==null,'resource entry exists');
 add('Agriculture UI visibility',document.querySelector('[data-view="agriculture"]')!==null,'agriculture entry exists');
 add('Trade UI visibility',document.querySelector('[data-view="trade"]')!==null,'trade entry exists');
 add('Map has six regions',$('worldMap').querySelectorAll('.region').length===6,`regions=${$('worldMap').querySelectorAll('.region').length}`);
 add('Projects have visible markers',!S.showProjects||S.projects.filter(p=>p.status==='building').length===$('worldMap').querySelectorAll('.marker .project').length,`building=${S.projects.filter(p=>p.status==='building').length}`);
 add('No hidden active mine',S.facilities.filter(f=>['oil_field','coal_mine','iron_mine'].includes(f.type)).every(f=>!!region(f.regionId)),'every mine has a map region');
 add('Facility visual stage',S.facilities.filter(f=>f.status==='active').every(f=>$('worldMap').textContent.includes(`${fn(f.type)} L${f.level}`)),'map label follows facility level');
 add('Event evidence integrity',S.events.every(e=>Array.isArray(e.evidence)),'events carry evidence arrays');
 S.debug.last=checks;window.__BE_SELF_CHECK__=checks;if(show)renderContext();return checks;
}
function renderDebug(){const c=S.debug.last.length?S.debug.last:runSelfCheck(false);const pass=c.filter(x=>x.ok).length;return sectionHead(tr('debug'),S.lang==='zh'?'重点检查“互相冲突”和“后台有但看不见”。':'Focus: cross-module conflicts and state that exists but is not visible.')+`<div class="grid2">${metric(tr('pass'),pass+'/'+c.length)}${metric(tr('allVisible'),c.every(x=>x.ok)?tr('pass'):tr('fail'))}</div><div class="divider"></div><div>${c.map(x=>`<div class="check"><i class="dot ${x.ok?'ok':'bad'}"></i><div><b>${esc(x.name)}</b><div class="small muted">${esc(x.detail)}</div></div></div>`).join('')}</div><div class="divider"></div><h3>${tr('moduleOrder')}</h3><div class="statusCard"><div class="statusBody">M1 World → M2 Development → M3 Economy → M9 Agriculture → M4 Population → M5 Trade → M6 AI → Consumption → M7 Situations → M8 Integration</div></div><div class="actionRow"><button class="btn primary" id="runCheck">${tr('selfcheck')}</button><button class="btn" id="exportBtn">${tr('exportState')}</button><button class="btn bad" id="restartBtn">${tr('restart')}</button></div>`}
function renderContext(){let html='';if(S.view==='dashboard')html=renderDashboard();if(S.view==='construction')html=renderConstruction();if(S.view==='resources')html=renderResources();if(S.view==='agriculture')html=renderAgriculture();if(S.view==='trade')html=renderTrade();if(S.view==='diplomacy')html=renderDiplomacy();if(S.view==='economy')html=renderEconomy();if(S.view==='society')html=renderSociety();if(S.view==='events')html=renderEvents();if(S.view==='debug')html=renderDebug();$('contextPanel').innerHTML=html;
 document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>startProject(b.dataset.build,S.selectedRegion));document.querySelectorAll('[data-explore]').forEach(b=>b.onclick=()=>explore(S.selectedRegion,b.dataset.explore));document.querySelectorAll('[data-maintain]').forEach(b=>b.onclick=()=>maintainFacility(b.dataset.maintain));document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>upgradeFacility(b.dataset.upgrade));document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{S.selectedRegion=b.dataset.region;render()});document.querySelectorAll('[data-quote]').forEach(b=>b.onclick=()=>getQuotes(b.dataset.quote));document.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>{const [g,i]=b.dataset.import.split(':');orderImport(g,+i,5)});
 if($('motor2Btn'))$('motor2Btn').onclick=startMotor2;if($('cropSelect'))$('cropSelect').onchange=e=>setCrop(S.selectedRegion,e.target.value);if($('runCheck'))$('runCheck').onclick=()=>runSelfCheck(true);if($('restartBtn'))$('restartBtn').onclick=()=>{if(confirm(S.lang==='zh'?'重开会清除当前局面，确定？':'Restart and clear the current run?')){S=makeInitialState();render()}};if($('exportBtn'))$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='world-lab-state.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}
function render(){document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));renderTop();renderNav();renderSituation();renderTutorial();renderMap();renderContext()}
function runRerenderRegression(){
 const originalMap=S.mapKey,originalRegion=S.selectedRegion,results=[];
 const check=(name,ok,detail='')=>results.push({name,ok:!!ok,detail});
 try{
   const expectedCities=S.regions.filter(r=>r.city||r.port).length;
   for(const slot of mapSlots()){
     if(!slot.available)continue;
     S.mapKey=slot.key;renderMap();
     check(`map switch ${slot.key}`,$('mapBaseImg')&&!$('mapBaseImg').hidden&&$('worldMap').querySelectorAll('.cityMarker').length===expectedCities,`cities=${$('worldMap').querySelectorAll('.cityMarker').length}`);
   }
   for(const r of S.regions){S.selectedRegion=r.id;renderMap();check(`parcel ${r.id}`,$('worldMap').querySelectorAll('.parcel').length===(S.showParcels?1:0)&&$('worldMap').querySelector(`[data-selected-parcel="${r.id}"]`)!=null,'single-outline');}
   renderMap();
   check('facility layer survives rerender',$('worldMap').querySelector('#facilityLayer')!=null,`facilityImages=${$('worldMap').querySelectorAll('.facilityImage').length}`);
   check('city layer survives rerender',$('worldMap').querySelectorAll('.cityMarker').length===S.regions.filter(r=>r.city||r.port).length,`cities=${$('worldMap').querySelectorAll('.cityMarker').length}`);
 }finally{S.mapKey=originalMap;S.selectedRegion=originalRegion;renderMap();}
 window.__BE_RERENDER_REGRESSION__=results;return results;
}
function save(){localStorage.setItem('world-causality-lab-v1-save',JSON.stringify(S));toast(S.lang==='zh'?'已保存到本机浏览器。':'Saved in this browser.')}
function load(){try{const raw=localStorage.getItem('world-causality-lab-v1-save');if(!raw){toast(S.lang==='zh'?'没有找到存档。':'No save found.');return}S=JSON.parse(raw);if(!S.mapKey)S.mapKey='map_01';__assetIndex=null;render();toast(S.lang==='zh'?'存档已读取。':'Save loaded.')}catch(e){showError(e)}}
function showError(e){const el=$('errorbar');el.style.display='block';el.textContent='Runtime error: '+(e&&e.message?e.message:String(e));window.__BE_RUNTIME_ERROR__=String(e)}
window.addEventListener('error',e=>showError(e.error||e.message));window.addEventListener('unhandledrejection',e=>showError(e.reason));
$('langBtn').onclick=()=>{S.lang=S.lang==='zh'?'en':'zh';render()};$('saveBtn').onclick=save;$('loadBtn').onclick=load;$('advanceBtn').onclick=advanceYear;$('toggleParcelsBtn').onclick=()=>{S.showParcels=!S.showParcels;renderMap();runSelfCheck(false)};$('toggleResourcesBtn').onclick=()=>{S.showResources=!S.showResources;renderMap()};$('toggleProjectsBtn').onclick=()=>{S.showProjects=!S.showProjects;renderMap();runSelfCheck(false)};
window.WorldLab={getState:()=>deepClone(S),advanceYear,setView,setRegion,setMap,startProject,explore,getQuotes,orderImport,runSelfCheck,runRerenderRegression,refreshAssets:()=>{__assetIndex=null;buildAssetIndex(true);renderMap();return runSelfCheck(false)},reset:()=>{S=makeInitialState();render()}};
render();runSelfCheck(false);renderContext();
})();
</script>
