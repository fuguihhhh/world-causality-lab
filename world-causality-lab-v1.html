<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Border Epoch — Language / 语言</title>
<style>
:root {
  color-scheme: dark;
  --bg:#071018; --panel:#0d1b25; --line:#294457; --text:#dcebf4;
  --muted:#8aa2b2; --blue:#2c6f95; --blue2:#3e87ad;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 30% 0,#14293a 0,#071018 44%,#050b10 100%);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.language-card{width:min(620px,94vw);border:1px solid var(--line);background:rgba(10,24,34,.96);
  border-radius:20px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.45);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.logo{width:50px;height:50px;border:1px solid #557a93;border-radius:13px;display:grid;place-items:center;
  font-weight:900;letter-spacing:.08em;background:linear-gradient(145deg,#1d384b,#0d1d28)}
h1{font-size:24px;margin:0;letter-spacing:.04em} .sub{color:var(--muted);margin-top:4px;font-size:13px}
.prompt{text-align:center;margin:28px 0 20px} .prompt b{display:block;font-size:21px;margin-bottom:6px}
.prompt span{color:var(--muted);font-size:13px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{min-height:78px;border:1px solid #36566b;background:#102532;color:var(--text);border-radius:14px;
  font:inherit;cursor:pointer;transition:.16s;padding:14px}
button:hover,button:focus-visible{background:#15364a;border-color:#5593b7;outline:none;transform:translateY(-1px)}
button strong{display:block;font-size:19px;margin-bottom:5px} button small{color:#9bb2c1;font-size:12px}
.note{margin-top:20px;text-align:center;color:#6f899b;font-size:11px}
@media(max-width:560px){.language-card{padding:25px 18px}.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="language-card" aria-labelledby="langTitle">
  <div class="brand">
    <div class="logo">BE</div>
    <div><h1>Border Epoch</h1><div class="sub">Living World · 国家发展模拟</div></div>
  </div>
  <div class="prompt" id="langTitle">
    <b>请选择语言 · Choose your language</b>
    <span>每次进入网页都会先显示此选择 / This choice appears each time you open the page.</span>
  </div>
  <div class="choices">
    <button id="chooseZh" type="button" autofocus><strong>中文</strong><small>进入中文版</small></button>
    <button id="chooseEn" type="button"><strong>English</strong><small>Open English version</small></button>
  </div>
  <div class="note">图片资源仍使用同目录下的两个 assets JS 文件。</div>
</main>

<script>
(function(){
  function decodePayload(id){
    const b64=document.getElementById(id).textContent.trim();
    const raw=atob(b64);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function launch(id,lang){
    let html=decodePayload(id);
    html=html.replace(
      '<head>',
      `<head><script>window.__BE_LANG__=${JSON.stringify(lang)};<\/script>`
    );
    document.open();
    document.write(html);
    document.close();
  }
  document.getElementById('chooseZh').addEventListener('click',()=>launch('payloadZh','zh'));
  document.getElementById('chooseEn').addEventListener('click',()=>launch('payloadEn','en'));
})();
</script>
</body>
</html>
